name: unit tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m unittest \
            tests.test_state_constraint_messages \
            tests.test_query_refinement \
            tests.test_followup \
            tests.test_reason_map
